<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Processing of one customer message</title>
  <desc id="desc">The customer asks a price, the agent decides to call get_product_details, the services apply the price rules and the agent answers in Portuguese.</desc>
  <rect width="1000" height="330" fill="#ffffff"/>
  <style>
    .step { font-size: 23px; font-weight: 700; }
    .txt { font-size: 20px; }
    .light { fill: #eef3f8; stroke: #0f2a4a; stroke-width: 2; }
    .dark { fill: #0f2a4a; stroke: #0f2a4a; stroke-width: 2; }
    .arrow { stroke: #c8102e; stroke-width: 4; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8102e"/>
    </marker>
  </defs>

  <rect x="3" y="10" width="178" height="310" rx="10" class="light"/>
  <text x="17" y="48" class="step" fill="#0f2a4a">1 · Customer</text>
  <text x="17" y="92" class="txt" fill="#1d2733">"Quanto custa</text>
  <text x="17" y="120" class="txt" fill="#1d2733">o Takamine</text>
  <text x="17" y="148" class="txt" fill="#1d2733">GD20?"</text>

  <path d="M183,165 L203,165" class="arrow"/>

  <rect x="209" y="10" width="186" height="310" rx="10" class="dark"/>
  <text x="223" y="48" class="step" fill="#ffffff">2 · Agent</text>
  <text x="223" y="92" class="txt" fill="#ffffff">Gemini reads</text>
  <text x="223" y="120" class="txt" fill="#ffffff">the prompt,</text>
  <text x="223" y="148" class="txt" fill="#ffffff">history and</text>
  <text x="223" y="176" class="txt" fill="#ffffff">tools, then</text>
  <text x="223" y="204" class="txt" fill="#ffffff">decides to look</text>
  <text x="223" y="232" class="txt" fill="#ffffff">up the product</text>

  <path d="M397,165 L417,165" class="arrow"/>

  <rect x="423" y="10" width="180" height="310" rx="10" class="light"/>
  <text x="437" y="48" class="step" fill="#0f2a4a">3 · Tool call</text>
  <text x="437" y="92" class="txt" fill="#1d2733">get_product_</text>
  <text x="437" y="120" class="txt" fill="#1d2733">details(</text>
  <text x="437" y="148" class="txt" fill="#1d2733">"Takamine</text>
  <text x="437" y="176" class="txt" fill="#1d2733">GD20")</text>

  <path d="M605,165 L625,165" class="arrow"/>

  <rect x="631" y="10" width="180" height="310" rx="10" class="light"/>
  <text x="645" y="48" class="step" fill="#0f2a4a">4 · Services</text>
  <text x="645" y="92" class="txt" fill="#1d2733">Fuzzy lookup</text>
  <text x="645" y="120" class="txt" fill="#1d2733">and price rules:</text>
  <text x="645" y="156" class="txt" fill="#1d2733">R$ 2.199,00</text>
  <text x="645" y="184" class="txt" fill="#1d2733">PIX 2.089,05</text>
  <text x="645" y="212" class="txt" fill="#1d2733">12x R$ 183,25</text>

  <path d="M813,165 L833,165" class="arrow"/>

  <rect x="839" y="10" width="158" height="310" rx="10" class="dark"/>
  <text x="851" y="48" class="step" fill="#ffffff">5 · Answer</text>
  <text x="851" y="92" class="txt" fill="#ffffff">Portuguese,</text>
  <text x="851" y="120" class="txt" fill="#ffffff">store tone,</text>
  <text x="851" y="148" class="txt" fill="#ffffff">only facts</text>
  <text x="851" y="176" class="txt" fill="#ffffff">from the</text>
  <text x="851" y="204" class="txt" fill="#ffffff">tool result</text>
</svg>

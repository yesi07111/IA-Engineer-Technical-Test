<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Layered architecture of the Empório da Música agent</title>
  <desc id="desc">Five layers: interfaces, application, domain, ports and infrastructure. Application and domain depend only on the ports; infrastructure implements them.</desc>
  <rect width="1000" height="560" fill="#ffffff"/>
  <style>
    .lname { fill: #ffffff; font-size: 21px; font-weight: 700; }
    .item { fill: #0f2a4a; font-size: 19px; }
    .box { fill: #f3f6f9; stroke: #9fb1c4; stroke-width: 1.5; }
    .core { fill: #fbeef0; stroke: #e39aa6; stroke-width: 1.5; }
    .note { fill: #5a6878; font-size: 17px; font-style: italic; }
  </style>

  <!-- Interfaces -->
  <rect x="10" y="10" width="180" height="84" rx="8" fill="#0f2a4a"/>
  <text x="100" y="59" text-anchor="middle" class="lname">Interfaces</text>
  <rect x="205" y="20" width="230" height="64" rx="8" class="box"/><text x="320" y="59" text-anchor="middle" class="item">CLI chat</text>
  <rect x="450" y="20" width="270" height="64" rx="8" class="box"/><text x="585" y="59" text-anchor="middle" class="item">Web chat + HTTP API</text>
  <rect x="735" y="20" width="255" height="64" rx="8" class="box"/><text x="862" y="59" text-anchor="middle" class="item">MCP server</text>

  <!-- Application -->
  <rect x="10" y="110" width="180" height="130" rx="8" fill="#0f2a4a"/>
  <text x="100" y="182" text-anchor="middle" class="lname">Application</text>
  <rect x="205" y="120" width="250" height="52" rx="8" class="box"/><text x="330" y="153" text-anchor="middle" class="item">Agent + system prompt</text>
  <rect x="470" y="120" width="140" height="52" rx="8" class="box"/><text x="540" y="153" text-anchor="middle" class="item">9 tools</text>
  <rect x="625" y="120" width="365" height="52" rx="8" class="box"/><text x="807" y="153" text-anchor="middle" class="item">ChatSession (memory per session)</text>
  <rect x="205" y="180" width="195" height="52" rx="8" class="box"/><text x="302" y="213" text-anchor="middle" class="item">CatalogService</text>
  <rect x="410" y="180" width="215" height="52" rx="8" class="box"/><text x="517" y="213" text-anchor="middle" class="item">OrderLookupService</text>
  <rect x="635" y="180" width="185" height="52" rx="8" class="box"/><text x="727" y="213" text-anchor="middle" class="item">HandoffService</text>
  <rect x="830" y="180" width="160" height="52" rx="8" class="box"/><text x="910" y="213" text-anchor="middle" class="item">DataAuditor</text>

  <!-- Domain -->
  <rect x="10" y="256" width="180" height="84" rx="8" fill="#c8102e"/>
  <text x="100" y="305" text-anchor="middle" class="lname">Domain</text>
  <rect x="205" y="266" width="170" height="64" rx="8" class="core"/><text x="290" y="305" text-anchor="middle" class="item">Models</text>
  <rect x="390" y="266" width="200" height="64" rx="8" class="core"/><text x="490" y="305" text-anchor="middle" class="item">PriceCalculator</text>
  <rect x="605" y="266" width="180" height="64" rx="8" class="core"/><text x="695" y="305" text-anchor="middle" class="item">ReturnPolicy</text>
  <rect x="800" y="266" width="190" height="64" rx="8" class="core"/><text x="895" y="305" text-anchor="middle" class="item">StoreSchedule</text>

  <!-- Ports -->
  <rect x="10" y="356" width="180" height="84" rx="8" fill="#0f2a4a"/>
  <text x="100" y="405" text-anchor="middle" class="lname">Ports</text>
  <rect x="205" y="366" width="330" height="64" rx="8" class="box"/><text x="370" y="405" text-anchor="middle" class="item">Repository interfaces (5 + tickets)</text>
  <rect x="550" y="366" width="230" height="64" rx="8" class="box"/><text x="665" y="405" text-anchor="middle" class="item">PolicySearch</text>
  <rect x="795" y="366" width="195" height="64" rx="8" class="box"/><text x="892" y="405" text-anchor="middle" class="item">Clock</text>

  <!-- Infrastructure -->
  <rect x="10" y="456" width="180" height="84" rx="8" fill="#5a6878"/>
  <text x="100" y="505" text-anchor="middle" class="lname">Infrastructure</text>
  <rect x="205" y="466" width="175" height="64" rx="8" class="box"/><text x="292" y="505" text-anchor="middle" class="item">CSV files</text>
  <rect x="390" y="466" width="215" height="64" rx="8" class="box"/><text x="497" y="505" text-anchor="middle" class="item">Policy PDF + BM25</text>
  <rect x="615" y="466" width="185" height="64" rx="8" class="box"/><text x="707" y="505" text-anchor="middle" class="item">Tickets JSONL</text>
  <rect x="810" y="466" width="180" height="64" rx="8" class="box"/><text x="900" y="505" text-anchor="middle" class="item">SQLite memory</text>
</svg>

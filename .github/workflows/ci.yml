name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[google,web,mcp,dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Type check
        run: mypy src

      - name: Tests (no API key needed)
        run: pytest -q

      - name: Data audit
        run: emporio audit

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empório da Música · Melody</title>
  <style>
    :root {
      --bg: #f4f6f8; --panel: #ffffff; --text: #1f2933; --muted: #6b7785;
      --brand: #1b5276; --accent: #f5a623; --me: #1b5276; --me-text: #ffffff;
      --bot: #eef2f6; --border: #d9e0e7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161c; --panel: #19212a; --text: #e6edf3; --muted: #93a1b0;
        --brand: #6fb3e0; --me: #2d6a96; --bot: #222c37; --border: #2c3846;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text); display: flex; justify-content: center;
    }
    main {
      width: 100%; max-width: 760px; height: 100dvh; display: flex; flex-direction: column;
      background: var(--panel); border-inline: 1px solid var(--border);
    }
    header { padding: 16px; border-bottom: 3px solid var(--accent); }
    header h1 { margin: 0; font-size: 1.2rem; color: var(--brand); }
    header p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; }
    .me { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .tools { font-size: .75rem; color: var(--muted); margin-top: 6px; }
    .error { align-self: center; color: #c0392b; font-size: .9rem; }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
    textarea {
      flex: 1; resize: none; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); font: inherit; min-height: 44px; max-height: 140px;
    }
    button {
      padding: 0 18px; border: 0; border-radius: 10px; background: var(--brand); color: #fff;
      font: inherit; font-weight: 600; cursor: pointer; min-height: 44px;
    }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Empório da Música</h1>
    <p>Fale com a Melody, nossa assistente virtual · Sua música começa aqui.</p>
  </header>
  <section id="log" aria-live="polite"></section>
  <form id="form">
    <label for="message" hidden>Mensagem</label>
    <textarea id="message" rows="1" maxlength="2000" placeholder="Digite sua mensagem..." required></textarea>
    <button id="send" type="submit">Enviar</button>
  </form>
</main>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("message");
  const send = document.getElementById("send");

  function newSessionId() {
    return "web-" + Math.random().toString(36).slice(2, 12);
  }
  let sessionId;
  try {
    sessionId = sessionStorage.getItem("emporio-session") || newSessionId();
    sessionStorage.setItem("emporio-session", sessionId);
  } catch (error) {
    sessionId = newSessionId();
  }

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  }

  function renderMarkdown(text) {
    return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }

  function addMessage(text, who, tools) {
    const bubble = document.createElement("div");
    bubble.className = "msg " + who;
    bubble.innerHTML = who === "bot" ? renderMarkdown(text) : escapeHtml(text);
    if (tools && tools.length) {
      const info = document.createElement("div");
      info.className = "tools";
      info.textContent = "consultou: " + tools.join(", ");
      bubble.appendChild(info);
    }
    log.appendChild(bubble);
    log.scrollTop = log.scrollHeight;
  }

  async function sendMessage(text) {
    addMessage(text, "me");
    send.disabled = true;
    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sessionId, message: text}),
      });
      const data = await response.json();
      if (!response.ok) {
        const detail = typeof data.detail === "string" ? data.detail : "Mensagem inválida.";
        throw new Error(detail);
      }
      addMessage(data.reply, "bot", data.tools_used);
    } catch (error) {
      const note = document.createElement("div");
      note.className = "error";
      note.textContent = error.message || "Não foi possível falar com a assistente.";
      log.appendChild(note);
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = "";
    sendMessage(text);
  });

  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });

  addMessage("Oi! Eu sou a Melody, da Empório da Música. Como posso te ajudar hoje?", "bot");
</script>
</body>
</html>
